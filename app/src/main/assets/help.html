<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duckurity Help Center</title>
  <style>
    body { font-family: sans-serif; margin: 16px; color: #222; }
    h1 { font-size: 20px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
    #results { margin-top: 16px; }
    .article { padding: 10px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>How can we help?</h1>
  <!--
    This bundled page is intentionally inert from a security
    standpoint: no query-string handling, no innerHTML, nothing that
    reflects untrusted input into the DOM. It exists only so
    HelpActivity has a legitimate default to fall back to -- it is
    NOT part of the challenge's solve path. The sole way to reach
    `nativeBridge` is the duckurity://help?url=<attacker http(s) page>
    deep link described in HelpActivity.kt / solve/SOLVE.md.
  -->
  <input id="q" type="text" placeholder="Search help articles...">
  <div id="results"></div>

  <script>
    const articles = [
      "Resetting your password",
      "Managing shared albums",
      "Contacting support"
    ];

    function renderResults(query) {
      const results = document.getElementById('results');
      results.textContent = ''; // clear safely, no innerHTML
      const matches = articles.filter(a =>
        a.toLowerCase().includes(query.toLowerCase())
      );
      matches.forEach(function (text) {
        const div = document.createElement('div');
        div.className = 'article';
        div.textContent = text; // safe: text node, not HTML
        results.appendChild(div);
      });
    }

    document.getElementById('q').addEventListener('keyup', function () {
      renderResults(this.value);
    });
  </script>
</body>
</html>
